name: Geler les photos dans le repo
on:
  push:
    paths:
      - ".github/workflows/freeze-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extraire les photos de Supabase
        run: |
          python3 - << 'PYEOF'
          import json, base64, os, urllib.request

          URL = "https://pryrofztqabprfsbauvo.supabase.co/rest/v1/evg_photos"
          KEY = "sb_publishable_1T3y9KiP4jzeAVF7xQkYKw_l35iOg0l"
          os.makedirs("photos", exist_ok=True)
          manifest, offset, lot = [], 0, 10
          while True:
              q = f"{URL}?select=id,stop_i,data,created_at&order=created_at.asc&limit={lot}&offset={offset}"
              req = urllib.request.Request(q, headers={"apikey": KEY, "Authorization": "Bearer " + KEY})
              rows = json.loads(urllib.request.urlopen(req, timeout=120).read())
              if not rows:
                  break
              for r in rows:
                  d = r["data"]
                  head, b64 = d.split(",", 1)
                  ext = "png" if "png" in head else "jpg"
                  path = f"photos/{r['id']}.{ext}"
                  with open(path, "wb") as f:
                      f.write(base64.b64decode(b64))
                  manifest.append({"id": r["id"], "i": r["stop_i"], "t": r["created_at"], "f": path})
              offset += lot
              print(f"{offset} photos traitees...")
          with open("photos/manifest.json", "w") as f:
              json.dump(manifest, f, ensure_ascii=False)
          print(f"Total: {len(manifest)} photos, manifest ecrit.")
          PYEOF
      - name: Committer les photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/
          git commit -m "Gel des photos du week-end dans le repo (extraction Supabase)"
          git push
